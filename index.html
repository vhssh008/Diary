<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 일기장</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f4a3f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일기장">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2b2b; --muted:#8a8576; --paper:#fffdf7; --desk:#e9e4d8; --line:#e4dccb;
  --accent:#2f4a3f; --accent-soft:#e3ece6; --red:#c0463a;
  --serif:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --fs:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--desk);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}

/* ---------- 로그인 / 안내 화면 ---------- */
.screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--paper);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:36px 30px;max-width:380px;width:100%;text-align:center}
.card h1{margin:8px 0 6px;font-family:var(--serif);font-size:28px}
.card p{margin:0 0 22px;color:var(--muted);line-height:1.6;font-size:15px}
.logo{font-size:46px}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 16px;border:1px solid #cfc8b6;background:#fff;border-radius:10px;font-size:16px;font-weight:600}
.btn-google:hover{background:#faf8f2}
.keep{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:14px;color:var(--ink);cursor:pointer}
.keep input{width:17px;height:17px;accent-color:var(--accent)}
.err{color:var(--red);font-size:14px;margin-top:14px;min-height:1em;line-height:1.5}
.setup-card{text-align:left;max-width:520px}
.setup-card code{background:#f1ede0;padding:2px 6px;border-radius:4px}

/* ---------- 메인 레이아웃 ---------- */
#main{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:var(--accent);color:#fff}
.top h1{cursor:pointer;margin:0 auto 0 4px;font-family:var(--serif);font-size:20px;font-weight:700;white-space:nowrap}
.top button{background:rgba(255,255,255,.14);border:0;border-radius:8px;color:#fff;padding:8px 12px;font-size:14px;white-space:nowrap}
.top button:hover{background:rgba(255,255,255,.26)}
.top .primary{background:#fff;color:var(--accent);font-weight:700}
.top .primary:hover{background:#f0f0f0}
.body{flex:1;min-height:0;display:flex;position:relative}

/* 사이드 패널 */
#side{width:300px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:12px 4px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent}
.tabs button.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent)}
.panel{flex:1;overflow-y:auto;padding:12px 12px 16px;min-height:0}
.cal-head{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.cal-head strong{min-width:110px;text-align:center;font-size:15px}
.cal-head button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.cal-head .mini{font-size:12px;padding:5px 8px;margin-left:4px}
.cal-head input{width:76px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:center;background:#fff}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .wd{font-size:12px;color:var(--muted);padding:4px 0}
.cal-grid .sun{color:#c0463a}.cal-grid .sat{color:#3a6bc0}
.day{position:relative;aspect-ratio:1;border:0;background:none;border-radius:50%;font-size:14px;padding:0}
.day:hover{background:var(--accent-soft)}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.day.sel{background:var(--accent);color:#fff}
.day.has::after{content:'';position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--red)}
.day.sel.has::after{background:#fff}
.list-count{font-size:13px;color:var(--muted);text-align:center;margin-bottom:6px}
.mh{margin:14px 0 4px;font-weight:700;font-size:14px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:3px}
.li{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:8px 6px;border-radius:8px;font-size:14px}
.li:hover{background:var(--accent-soft)}
.li.sel{background:var(--accent-soft);font-weight:700}
.ld{flex:none;width:72px;color:var(--muted);font-size:13px}
.lt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lt i{color:#b5b0a0}
.muted{color:var(--muted);font-size:14px;text-align:center;padding:20px 0}
.side-foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.side-foot button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;font-size:13px;text-align:left}
.side-foot button:hover{background:var(--accent-soft)}
#userMail{font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:2px}
#scrim{display:none}

/* 책 영역 */
#bookWrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
#book{flex:1;min-height:0;display:flex;justify-content:center;padding:16px}
.spread{display:flex;width:100%;max-width:1400px;height:100%}
.spread.one{max-width:820px}
.sheet{flex:1;min-width:0;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.14);border-radius:10px}
.spread.two .sheet.left{border-radius:10px 0 0 10px;box-shadow:0 3px 14px rgba(0,0,0,.14),inset -22px 0 24px -22px rgba(0,0,0,.28)}
.spread.two .sheet.right{border-radius:0 10px 10px 0;box-shadow:0 3px 14px rgba(0,0,0,.14),inset 22px 0 24px -22px rgba(0,0,0,.28)}
.sheet.blank{display:flex;align-items:center;justify-content:center;background:#f7f3e8}
.blank-msg{color:#b5b0a0;font-size:14px;text-align:center;line-height:1.7}
.spread.flip-next.two .sheet.right{transform-origin:left center;animation:flipN .5s ease}
.spread.flip-prev.two .sheet.left{transform-origin:right center;animation:flipP .5s ease}
.spread.flip-next.one .sheet{animation:slideN .3s ease}
.spread.flip-prev.one .sheet{animation:slideP .3s ease}
@keyframes flipN{from{transform:perspective(1800px) rotateY(-85deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes flipP{from{transform:perspective(1800px) rotateY(85deg);opacity:.2}to{transform:none;opacity:1}}
@keyframes slideN{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideP{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}

.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.pager button{border:1px solid #cfc8b6;background:var(--paper);border-radius:8px;padding:8px 16px;font-size:14px}
.pager button:hover{background:#fff}
#pagerLabel{min-width:170px;text-align:center;font-size:14px;color:var(--muted)}

.empty{margin:auto;text-align:center;padding:30px}
.empty .logo{font-size:56px}
.empty h2{font-family:var(--serif);margin:10px 0 6px}
.empty p{color:var(--muted);margin:0 0 20px;line-height:1.6}
.empty button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:13px 24px;font-size:16px;font-weight:700}

/* ---------- 일기 종이 ---------- */
.paper{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 30px 0;display:flex;flex-direction:column;gap:12px;font-family:var(--serif)}
.p-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.p-datebox{display:flex;gap:12px;font-family:var(--sans);font-size:15px;align-items:baseline}
.p-datebox b{font-size:24px;margin-right:2px}
.p-wx{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.wx{position:relative;border:0;background:none;padding:5px 9px;font-size:14px;font-family:var(--sans);color:var(--ink);white-space:nowrap}
.wx .ic{font-size:19px;margin-right:2px;vertical-align:-2px}
.wx.on::after{content:'';position:absolute;inset:-1px -2px;border:2.5px solid var(--red);border-radius:52% 48% 55% 45% / 48% 55% 45% 52%;transform:rotate(-3deg);pointer-events:none}
.wx-text{width:92px;border:0;border-bottom:1px dashed #c9c2ae;background:transparent;font-family:var(--sans);font-size:14px;padding:4px 2px;margin-left:6px;outline:none}
.p-fs{margin-left:auto;display:flex;gap:4px}
.p-fs button{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:18px;line-height:1;font-family:var(--sans)}
.p-fs button:hover{background:var(--accent-soft)}
.p-title{border:0;border-bottom:1px dashed var(--line);background:transparent;font-family:inherit;font-weight:700;font-size:calc(var(--fs)*1.35);padding:8px 2px;outline:none;color:var(--ink);width:100%}
.p-photos{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.p-photos figure{position:relative;margin:0}
.p-photos img{height:150px;max-width:100%;border-radius:8px;display:block;cursor:zoom-in;object-fit:cover}
.ph-x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;padding:0}
.p-body{border:0;resize:none;overflow:hidden;background:transparent;font-family:inherit;font-size:var(--fs);line-height:1.9;min-height:45vh;outline:none;color:var(--ink);width:100%;padding:4px 2px}
.p-title::placeholder,.p-body::placeholder{color:#c5bfae;font-weight:400}
.p-foot{margin-top:auto;position:sticky;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 0 12px;background:var(--paper);border-top:1px solid var(--line);font-family:var(--sans)}
.clip{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;cursor:pointer;color:var(--accent)}
.clip:hover{background:var(--accent-soft)}
.clip svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p-status{font-size:13px;color:var(--muted);margin-right:auto}
.p-del{border:0;background:none;color:#b3705f;font-size:13px;padding:6px 8px;border-radius:6px}
.p-del:hover{background:#f7e6e1}


/* 홈 화면 */
.home{width:100%;height:100%;overflow-y:auto}
.home-in{max-width:720px;margin:0 auto;padding:28px 20px 40px}
.home-date{color:var(--muted);font-size:14px}
.home-h{font-family:var(--serif);font-size:27px;margin:6px 0 18px}
.home-actions{display:flex;gap:10px;flex-wrap:wrap}
.big{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:15px 26px;font-size:17px;font-weight:700}
.big:hover{filter:brightness(1.12)}
.ghost{background:var(--paper);border:1px solid #cfc8b6;border-radius:12px;padding:15px 20px;font-size:15px}
.home h3{margin:32px 0 10px;font-size:15px;color:var(--accent)}
.hc{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hc:hover{border-color:var(--accent)}
.hc .hd{font-size:13px;color:var(--muted)}
.hc .ht{font-family:var(--serif);font-weight:700;font-size:17px;margin:4px 0}
.hc .ht i{color:#b5b0a0;font-weight:400}
.hc .hp{color:#6d6a5f;font-size:14px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mobile-only{display:none}

/* 완료 버튼 */
.p-done{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 20px;font-size:14px;font-weight:700}
.p-done:hover{filter:brightness(1.15)}

/* 달력: 연도 입력 + 월 버튼 */
.cal-year{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.cal-year button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px}
.cal-year .mini{font-size:12px;padding:5px 8px;margin-left:4px}
.cal-year input{width:78px;padding:5px 6px;border:1px solid var(--line);border-radius:8px;font-size:16px;text-align:center;background:#fff}
.cal-months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:12px}
.mo{position:relative;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;font-size:13px}
.mo:hover{background:var(--accent-soft)}
.mo.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.mo.has::after{content:'';position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--red)}
/* 일기 쓴 날: 초록 칸 + 굵은 글씨 + 빨간 점 */
.day.has{background:#cfe4d6;font-weight:700;color:#1f3329}
.day.sel,.day.sel.has{background:var(--accent);color:#fff}
.cal-legend{font-size:12px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6}
.cal-legend .lg{display:inline-block;width:14px;height:14px;border-radius:50%;background:#cfe4d6;vertical-align:-2px;margin-right:4px}

/* 확대 보기 / 토스트 */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
#lightbox img{max-width:100%;max-height:100%;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;z-index:60;max-width:90vw;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#toast.show{opacity:1}

/* ---------- 모바일 / 좁은 화면 ---------- */
#btnMenu{display:none}
@media (max-width:899px){
  #btnMenu{display:inline-block}
  #btnMode{display:none}
  .mobile-only{display:inline-block}
  .p-done{padding:9px 14px}
  #side{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);z-index:30;transform:translateX(-102%);transition:transform .25s;box-shadow:4px 0 24px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
  body.side-open #side{transform:none}
  body.side-open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  #book{padding:0}
  .sheet,.spread.two .sheet{border-radius:0}
  .paper{padding:16px 16px 0}
  .p-datebox b{font-size:21px}
  .p-datebox{gap:8px}
  .top .label{display:none}
  .top h1{font-size:18px}
  #pagerLabel{min-width:0;flex:1;font-size:13px}
}
@media (min-width:900px){ #scrim{display:none!important} }
</style>
</head>
<body>

<!-- 불러오는 중 -->
<div id="splash" class="screen"><div class="logo">📖</div></div>

<!-- Firebase 설정이 아직 안 된 경우 -->
<div id="setupNeeded" class="screen" hidden>
  <div class="card setup-card">
    <div class="logo" style="text-align:center">🛠️</div>
    <h1 style="text-align:center">설정이 필요해요</h1>
    <p><code>firebase-config.js</code> 파일에 Firebase 설정값을 붙여넣어야 앱이 동작해요.<br>같이 들어있는 <code>SETUP.md</code>의 1~6번을 따라 해주세요.</p>
  </div>
</div>

<!-- 로그인 -->
<div id="login" class="screen" hidden>
  <div class="card">
    <div class="logo">📖</div>
    <h1>내 일기장</h1>
    <p>어디서든 이어 쓰는 나만의 일기장</p>
    <button id="btnLogin" class="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.8c4.3-4 6.9-9.9 6.9-17.2z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.8c-2.1 1.4-4.9 2.3-8.5 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Google로 로그인
    </button>
    <label class="keep"><input type="checkbox" id="keepLogin" checked> 로그인 상태 유지</label>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 메인 -->
<div id="main" hidden>
  <header class="top">
    <button id="btnMenu" aria-label="메뉴">☰</button>
    <h1 id="btnTitle" title="홈으로">📖 내 일기장</h1>
    <button id="btnHome">🏠<span class="label"> 홈</span></button>
    <button id="btnMode" title="보기 방식 바꾸기"></button>
    <button id="btnNew" class="primary">＋<span class="label"> 새 일기</span></button>
  </header>
  <div class="body">
    <aside id="side">
      <div class="tabs">
        <button data-tab="cal" class="on">📅 달력</button>
        <button data-tab="list">📚 연도별 목록</button>
      </div>
      <div id="panelCal" class="panel"></div>
      <div id="panelList" class="panel" hidden></div>
      <div class="side-foot">
        <div id="userMail"></div>
        <button id="btnBackup">💾 백업 파일 받기 (.json · 사진 포함)</button>
        <button id="btnTxt">📄 글만 텍스트로 받기 (.txt)</button>
        <button id="btnRestore">♻️ 백업 파일 불러오기</button>
        <input type="file" id="fileRestore" accept=".json,application/json" hidden>
        <button id="btnLogout">로그아웃</button>
      </div>
    </aside>
    <div id="scrim"></div>
    <div id="bookWrap">
      <div id="book"></div>
      <nav class="pager" id="pager" hidden>
        <button id="btnPrev">◀ 이전</button>
        <span id="pagerLabel"></span>
        <button id="btnNext">다음 ▶</button>
      </nav>
    </div>
  </div>
</div>

<div id="lightbox" hidden><img alt=""></div>
<div id="toast"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
  onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, browserSessionPersistence
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, where, orderBy, limit
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

/* ================= 공통 도우미 ================= */
const $ = (s, r = document) => r.querySelector(s);
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const dots = s => s.replace(/-/g, '.');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WX = [
  { k: 'sun', i: '☀️', t: '맑음' }, { k: 'partly', i: '⛅', t: '구름조금' },
  { k: 'cloud', i: '☁️', t: '흐림' }, { k: 'rain', i: '🌧️', t: '비' },
  { k: 'snow', i: '❄️', t: '눈' }, { k: 'wind', i: '💨', t: '바람' }
];
let toastTimer;
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}
function show(id) {
  ['splash', 'setupNeeded', 'login', 'main'].forEach(x => { $('#' + x).hidden = x !== id; });
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 8000);
}

if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true; location.reload();
  });
}

/* ================= Firebase 시작 ================= */
const configured = !String(firebaseConfig.apiKey || '').includes('여기에');
let auth, db, uid = null, userEmail = '';

if (!configured) {
  show('setupNeeded');
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  getRedirectResult(auth).catch(e => { $('#loginErr').textContent = authMsg(e); });
  onAuthStateChanged(auth, u => {
    if (u) { uid = u.uid; userEmail = u.email || ''; show('main'); startApp(); }
    else { uid = null; resetApp(); show('login'); }
  });
}

function authMsg(e) {
  const c = e && e.code || '';
  if (c === 'auth/unauthorized-domain') return '이 주소가 Firebase의 "승인된 도메인"에 없어요. SETUP.md 3번을 확인해주세요.';
  if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
  if (c === 'auth/network-request-failed') return '인터넷 연결을 확인해주세요.';
  return '로그인에 실패했어요. (' + (c || e.message || '알 수 없는 오류') + ')';
}

$('#btnLogin').addEventListener('click', async () => {
  const err = $('#loginErr'); err.textContent = '';
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  try {
    await setPersistence(auth, $('#keepLogin').checked ? browserLocalPersistence : browserSessionPersistence);
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
      try { await signInWithRedirect(auth, provider); } catch (e2) { err.textContent = authMsg(e2); }
    } else err.textContent = authMsg(e);
  }
});

$('#btnLogout').addEventListener('click', async () => {
  await flushAll();
  await signOut(auth);
});

/* ================= Firestore 도우미 ================= */
const entriesCol = () => collection(db, 'users', uid, 'entries');

async function neighbor(date, dir, n = 1) {
  const q = dir > 0
    ? query(entriesCol(), where('date', '>', date), orderBy('date', 'asc'), limit(n))
    : query(entriesCol(), where('date', '<', date), orderBy('date', 'desc'), limit(n));
  const s = await getDocs(q);
  return s.docs.map(d => d.id);
}

function getYear(y) {
  if (yearCache.has(y)) return yearCache.get(y);
  const p = (async () => {
    const q = query(entriesCol(), where('date', '>=', `${y}-01-01`), where('date', '<=', `${y}-12-31`), orderBy('date'));
    const s = await getDocs(q);
    const m = new Map();
    s.docs.forEach(d => { const x = d.data(); m.set(d.id, { title: x.title || '', weather: x.weather || '' }); });
    return m;
  })();
  yearCache.set(y, p);
  p.catch(() => yearCache.delete(y));
  return p;
}
function cacheUpsert(date, title, weather) {
  const p = yearCache.get(+date.slice(0, 4)); if (!p) return;
  p.then(m => {
    const old = m.get(date);
    m.set(date, { title, weather });
    if (!old || old.title !== title) refreshSide();
  });
}
function cacheRemove(date) {
  const p = yearCache.get(+date.slice(0, 4)); if (!p) return;
  p.then(m => { m.delete(date); refreshSide(); });
}

/* ================= 사진 줄이기 ================= */
const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
async function compressImage(file) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let scale = Math.min(1, 1280 / Math.max(w0, h0));
  for (let tries = 0; tries < 6; tries++) {
    const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
    for (let q = 0.85; q >= 0.49; q -= 0.1) {
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
      if (blob && blob.size <= 380 * 1024) return blobToDataURL(blob);
    }
    scale *= 0.8;
  }
  throw new Error('이미지가 너무 커요');
}

/* ================= 일기 한 장 (페이지) ================= */
function createPage(date) {
  const ref = doc(db, 'users', uid, 'entries', date);
  const st = { title: '', weather: '', weatherText: '', body: '', photoCount: 0, exists: false };
  let loaded = false, dirty = false, timer = null, photos = [], dead = false;
  const pending = new Set();
  const track = pr => { pending.add(pr); const fin = () => pending.delete(pr); pr.then(fin, fin); return pr; };
  const d0 = parseYmd(date);

  const el = document.createElement('article');
  el.className = 'paper';
  el.innerHTML = `
    <div class="p-head">
      <div class="p-datebox">
        <span><b>${d0.getFullYear()}</b>년</span><span><b>${d0.getMonth() + 1}</b>월</span>
        <span><b>${d0.getDate()}</b>일</span><span><b>${WD[d0.getDay()]}</b>요일</span>
      </div>
      <div class="p-wx">
        ${WX.map(w => `<button class="wx" data-k="${w.k}" type="button"><span class="ic">${w.i}</span>${w.t}</button>`).join('')}
        <input class="wx-text" maxlength="12" placeholder="직접 입력">
      </div>
      <div class="p-fs">
        <button class="fs-minus" type="button" title="글씨 작게" aria-label="글씨 작게">−</button>
        <button class="fs-plus" type="button" title="글씨 크게" aria-label="글씨 크게">＋</button>
      </div>
    </div>
    <input class="p-title" maxlength="100" placeholder="제목" disabled>
    <div class="p-photos" hidden></div>
    <textarea class="p-body" placeholder="오늘 하루는 어땠나요?" spellcheck="false" disabled></textarea>
    <div class="p-foot">
      <label class="clip" title="사진 첨부">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        <input type="file" accept="image/*" multiple hidden>
      </label>
      <span class="p-status"></span>
      <button class="p-del" type="button" hidden>이 일기 삭제</button>
      <button class="p-done" type="button">✓ 완료</button>
    </div>`;

  const $t = $('.p-title', el), $b = $('.p-body', el), $wt = $('.wx-text', el);
  const $ph = $('.p-photos', el), $st = $('.p-status', el), $del = $('.p-del', el), $file = $('input[type=file]', el), $done = $('.p-done', el);
  const setStatus = s => { $st.textContent = s; };
  const fit = () => { $b.style.height = 'auto'; $b.style.height = Math.max($b.scrollHeight, 0) + 'px'; };
  const paintWx = () => el.querySelectorAll('.wx').forEach(b => b.classList.toggle('on', b.dataset.k === st.weather));

  function schedule() { dirty = true; setStatus('입력 중…'); clearTimeout(timer); timer = setTimeout(save, 800); }
  function save() {
    clearTimeout(timer);
    if (!loaded || !dirty || dead) return;
    dirty = false;
    const has = st.title || st.body || st.weather || st.weatherText || st.photoCount;
    if (!has && !st.exists) { setStatus(''); return; }
    const data = { date, title: st.title, weather: st.weather, weatherText: st.weatherText, body: st.body, photoCount: st.photoCount, updatedAt: Date.now() };
    if (!st.exists) data.createdAt = Date.now();
    setStatus(navigator.onLine ? '저장 중…' : '오프라인 — 연결되면 자동 저장돼요');
    st.exists = true; $del.hidden = false;
    cacheUpsert(date, st.title, st.weather);
    const w = setDoc(ref, data, { merge: true }); track(w);
    w.then(() => { if (!dirty) setStatus('저장됨 ✓'); })
      .catch(e => { console.error(e); setStatus('저장 실패'); toast(e.code === 'permission-denied' ? '권한 오류예요. Firestore 규칙의 이메일을 확인해주세요.' : '저장에 실패했어요.'); });
  }

  /* 입력 이벤트 */
  $t.addEventListener('input', () => { st.title = $t.value; schedule(); });
  $b.addEventListener('input', () => { st.body = $b.value; fit(); schedule(); });
  $wt.addEventListener('input', () => { st.weatherText = $wt.value; schedule(); });
  el.querySelectorAll('.wx').forEach(b => b.addEventListener('click', () => {
    if (!loaded) return;
    st.weather = st.weather === b.dataset.k ? '' : b.dataset.k; paintWx(); schedule();
  }));
  $('.fs-minus', el).addEventListener('click', () => changeFs(-2));
  $('.fs-plus', el).addEventListener('click', () => changeFs(2));
  document.addEventListener('fschange', fit);
  window.addEventListener('resize', fit);

  /* 사진 */
  function drawPhotos() {
    $ph.hidden = photos.length === 0;
    $ph.innerHTML = '';
    photos.forEach(p => {
      const f = document.createElement('figure');
      const img = document.createElement('img'); img.src = p.data; img.alt = '첨부 사진';
      img.addEventListener('click', () => { $('#lightbox img').src = p.data; $('#lightbox').hidden = false; });
      const x = document.createElement('button'); x.className = 'ph-x'; x.type = 'button'; x.textContent = '✕'; x.title = '사진 삭제';
      x.addEventListener('click', async () => {
        if (!confirm('이 사진을 삭제할까요?')) return;
        photos = photos.filter(q => q.id !== p.id); drawPhotos();
        st.photoCount = photos.length; dirty = true; save();
        deleteDoc(doc(collection(ref, 'photos'), p.id)).catch(console.error);
      });
      f.append(img, x); $ph.appendChild(f);
    });
  }
  async function loadPhotos() {
    try {
      const s = await getDocs(query(collection(ref, 'photos'), orderBy('ts')));
      photos = s.docs.map(d => ({ id: d.id, ...d.data() })); drawPhotos();
    } catch (e) { console.error(e); }
  }
  $file.addEventListener('change', async () => {
    const files = [...$file.files]; $file.value = '';
    if (!loaded) return;
    for (const f of files) {
      if (!f.type.startsWith('image/')) { toast('사진(이미지)만 첨부할 수 있어요.'); continue; }
      try {
        setStatus('사진 처리 중…');
        const data = await compressImage(f);
        if (data.length > 900000) throw new Error('size');
        const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
        photos.push({ id, data, ts: Date.now(), name: f.name }); drawPhotos();
        const pw = setDoc(doc(collection(ref, 'photos'), id), { data, ts: Date.now(), name: f.name }); track(pw);
        pw.catch(e => { console.error(e); toast('사진 저장에 실패했어요.'); });
        st.photoCount = photos.length; dirty = true; save();
      } catch (e) { console.error(e); toast('사진을 처리하지 못했어요: ' + f.name); setStatus(''); }
    }
  });

  $done.addEventListener('click', completeAll);

  /* 삭제 */
  $del.addEventListener('click', async () => {
    if (!confirm(`${dots(date)} 일기를 삭제할까요?\n사진도 함께 지워지고 되돌릴 수 없어요.`)) return;
    dead = true; clearTimeout(timer);
    try {
      const ps = await getDocs(collection(ref, 'photos'));
      for (const p of ps.docs) await deleteDoc(p.ref);
      await deleteDoc(ref);
      toast('삭제했어요.');
      afterDelete(date);
    } catch (e) { console.error(e); dead = false; toast('삭제에 실패했어요.'); }
  });

  /* 불러오기 */
  (async () => {
    try {
      const snap = await getDoc(ref);
      if (dead) return;
      if (snap.exists()) {
        const x = snap.data();
        st.title = x.title || ''; st.weather = x.weather || ''; st.weatherText = x.weatherText || '';
        st.body = x.body || ''; st.photoCount = x.photoCount || 0; st.exists = true;
        $t.value = st.title; $b.value = st.body; $wt.value = st.weatherText; $del.hidden = false;
        if (st.photoCount > 0) loadPhotos();
      }
      loaded = true; paintWx();
      $t.disabled = false; $b.disabled = false;
      fit();
      if (!snap.exists() && !pages.some(p => p !== api && p.el.contains(document.activeElement))) $b.focus({ preventScroll: true });
    } catch (e) {
      console.error(e); setStatus('불러오기 실패');
      toast(e.code === 'permission-denied' ? '권한 오류예요. Firestore 규칙의 이메일을 확인해주세요.' : '일기를 불러오지 못했어요.');
    }
  })();

  const api = {
    el,
    flush() { if (dirty) save(); },
    settle(ms = 4000) {
      if (dirty) save();
      if (!pending.size) return Promise.resolve('ok');
      if (!navigator.onLine) return Promise.resolve('timeout');
      const all = Promise.allSettled([...pending]).then(rs => rs.some(r => r.status === 'rejected') ? 'fail' : 'ok');
      return Promise.race([all, new Promise(r => setTimeout(() => r('timeout'), ms))]);
    },
    destroy() {
      dead = true; clearTimeout(timer);
      document.removeEventListener('fschange', fit); window.removeEventListener('resize', fit);
    }
  };
  return api;
}

function changeFs(delta) {
  fs = Math.min(36, Math.max(12, fs + delta));
  localStorage.setItem('diary-fs', fs);
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.dispatchEvent(new Event('fschange'));
}

function flushAll() { pages.forEach(p => p.flush()); return Promise.resolve(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAll(); });
window.addEventListener('pagehide', flushAll);

/* ================= 화면 그리기 / 이동 ================= */
async function startApp() {
  if (started) return; started = true;
  $('#userMail').textContent = userEmail;
  updateModeBtn();
  render();
}

async function openDate(date, dir) {
  await flushAll();
  if (isTwo()) {
    const [nx] = await neighbor(date, 1, 1);
    if (nx) view = { left: date, right: nx };
    else {
      const [pv] = await neighbor(date, -1, 1);
      view = pv ? { left: pv, right: date } : { left: date, right: null };
    }
  } else view = { left: date, right: null };
  render(dir);
  closeSide();
}

function render(dir) {
  pages.forEach(p => p.destroy()); pages = [];
  const book = $('#book'); book.innerHTML = '';
  if (!view.left) { renderHome(); $('#pager').hidden = true; refreshSide(true); return; }
  const two = isTwo();
  const sp = document.createElement('div');
  sp.className = 'spread ' + (two ? 'two' : 'one') + (dir ? ' flip-' + dir : '');
  const mk = (date, cls) => {
    const s = document.createElement('div'); s.className = 'sheet ' + cls;
    if (date) { const pg = createPage(date); pages.push(pg); s.appendChild(pg.el); }
    else { s.classList.add('blank'); s.innerHTML = '<div class="blank-msg">아직 다음 장이 없어요<br>새 일기를 쓰면 여기에 이어져요</div>'; }
    sp.appendChild(s);
  };
  mk(view.left, 'left');
  if (two) mk(view.right, 'right');
  book.appendChild(sp);
  $('#pager').hidden = false;
  $('#pagerLabel').textContent = dots(view.left) + (two && view.right ? '  ·  ' + dots(view.right) : '');
  const base = parseYmd(view.left);
  side.calY = base.getFullYear(); side.calM = base.getMonth(); side.listY = base.getFullYear();
  refreshSide(true);
}

async function flipNext() {
  if (!view.left) return;
  await flushAll();
  const last = isTwo() ? (view.right || view.left) : view.left;
  const [a] = await neighbor(last, 1, 1);
  if (!a) { toast('마지막 일기예요.'); return; }
  if (isTwo()) {
    const [b] = await neighbor(a, 1, 1);
    view = { left: a, right: b || null }; render('next');
  } else { view = { left: a, right: null }; render('next'); }
}
async function flipPrev() {
  if (!view.left) return;
  await flushAll();
  if (isTwo()) {
    const arr = await neighbor(view.left, -1, 2);
    if (!arr.length) { toast('첫 일기예요.'); return; }
    view = arr.length === 2 ? { left: arr[1], right: arr[0] } : { left: arr[0], right: view.left };
  } else {
    const [a] = await neighbor(view.left, -1, 1);
    if (!a) { toast('첫 일기예요.'); return; }
    view = { left: a, right: null };
  }
  render('prev');
}
async function afterDelete(date) {
  cacheRemove(date);
  await showHome();
}

async function showHome() {

  view = { left: null, right: null };

function renderHome() {

  book.innerHTML = `<div class="home"><div class="home-in">
    <div class="home-date">${n.getFullYear()}년 ${n.getMonth() + 1}월 ${n.getDate()}일 ${WD[n.getDay()]}요일</div>
    <h2 class="home-h">오늘 하루는 어땠나요?</h2>
    <div class="home-actions">
      <button id="homeToday" class="big">✏️ 오늘 일기 쓰기</button>
      <button id="homeMenu" class="ghost mobile-only">📅 달력 · 연도별 목록</button>
    </div>
    <h3>최근 일기</h3>
    <div id="homeList"><p class="muted">불러오는 중…</p></div>
  </div></div>`;
  $('#homeToday').addEventListener('click', () => openDate(t));
  $('#homeMenu').addEventListener('click', () => document.body.classList.add('side-open'));
  const gen = ++homeGen;
  getDocs(query(entriesCol(), orderBy('date', 'desc'), limit(10))).then(snap => {
    const list = $('#homeList');
    if (gen !== homeGen || !list) return;
    if (!snap.docs.length) { list.innerHTML = '<p class="muted">아직 쓴 일기가 없어요.<br>위 버튼으로 첫 일기를 써보세요.</p>'; return; }
    if (snap.docs[0].id === t) $('#homeToday').textContent = '✏️ 오늘 일기 이어 쓰기';
    list.innerHTML = '';
    snap.docs.forEach(d => {
      const x = d.data(), dt = parseYmd(d.id);
      const b = document.createElement('button'); b.className = 'hc'; b.type = 'button';
      const prev = (x.body || '').replace(/\s+/g, ' ').trim().slice(0, 90);
      b.innerHTML = `<div class="hd">${dt.getFullYear()}년 ${dt.getMonth() + 1}월 ${dt.getDate()}일 ${WD[dt.getDay()]}요일${x.photoCount ? ' · 📎' : ''}</div>`
        + `<div class="ht">${x.title ? esc(x.title) : '<i>제목 없음</i>'}</div>` + (prev ? `<div class="hp">${esc(prev)}</div>` : '');
      b.addEventListener('click', () => openDate(d.id));
      list.appendChild(b);
    });
  }).catch(e => {
    console.error(e);
    const l = $('#homeList'); if (l) l.innerHTML = '<p class="muted">일기를 불러오지 못했어요.</p>';
    toast(e.code === 'permission-denied' ? '권한 오류예요. Firestore 규칙의 이메일을 확인해주세요.' : '일기를 불러오지 못했어요.', 5000);
  });
}

/* ---------- 완료 버튼 ---------- */
let completing = false;
async function completeAll() {
  if (completing) return;
  completing = true;
  try {
    const rs = await Promise.all(pages.map(p => p.settle()));
    if (rs.includes('fail')) { toast('저장에 실패한 내용이 있어요. 잠시 후 다시 눌러주세요.', 4000); return; }
    toast(rs.includes('timeout') ? '오프라인이에요. 인터넷에 연결되면 자동으로 저장돼요.' : '저장했어요 ✓', 3000);
    await showHome();
  } finally { completing = false; }
}
$('#btnHome').addEventListener('click', showHome);
$('#btnTitle').addEventListener('click', showHome);

$('#btnNew').addEventListener('click', () => openDate(today()));
$('#btnPrev').addEventListener('click', flipPrev);
$('#btnNext').addEventListener('click', flipNext);
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'ArrowRight') flipNext(); else if (e.key === 'ArrowLeft') flipPrev();
});
$('#lightbox').addEventListener('click', () => { $('#lightbox').hidden = true; });

function updateModeBtn() { $('#btnMode').textContent = isTwo() ? '📖 두 쪽 보기' : '📄 한 쪽 보기'; }
$('#btnMode').addEventListener('click', () => {
  mode = mode === 'two' ? 'one' : 'two';
  localStorage.setItem('diary-mode', mode); updateModeBtn();
  if (view.left) openDate(view.left);
});
let lastTwo = isTwo(), rzTimer;
window.addEventListener('resize', () => {
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    if (isTwo() !== lastTwo) { lastTwo = isTwo(); updateModeBtn(); if (view.left) openDate(view.left); }
  }, 250);
});

/* ================= 사이드 패널 (달력 / 연도별 목록) ================= */
const closeSide = () => document.body.classList.remove('side-open');
$('#btnMenu').addEventListener('click', () => document.body.classList.toggle('side-open'));
$('#scrim').addEventListener('click', closeSide);
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  side.tab = b.dataset.tab;
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  refreshSide(true);
}));

let sideTimer;
function refreshSide(now) {
  clearTimeout(sideTimer);
  const run = () => {
    if (!uid) return;
    $('#panelCal').hidden = side.tab !== 'cal';
    $('#panelList').hidden = side.tab !== 'list';
    (side.tab === 'cal' ? drawCal() : drawList()).catch(e => console.error(e));
  };
  if (now) run(); else sideTimer = setTimeout(run, 300);
}

async function drawCal() {
  const host = $('#panelCal'), y = side.calY, m = side.calM;
  let map; try { map = await getYear(y); } catch { map = new Map(); }
  const monthsWith = new Set(); map.forEach((v, k) => monthsWith.add(Number(k.slice(5, 7)) - 1));
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), t = today();
  let h = `<div class="cal-year"><button data-cy="-1" title="이전 해">◀</button><input type="number" id="calYearInp" value="${y}" min="1900" max="2999"><span>년</span><button data-cy="1" title="다음 해">▶</button><button class="mini" data-c="t">오늘</button></div>`;
  h += '<div class="cal-months">';
  for (let i = 0; i < 12; i++) h += `<button class="mo${i === m ? ' on' : ''}${monthsWith.has(i) ? ' has' : ''}" data-m="${i}">${i + 1}월</button>`;
  h += '</div><div class="cal-grid">';
  WD.forEach((w, i) => { h += `<div class="wd${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`; });
  for (let i = 0; i < first.getDay(); i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`;
    const c = ['day']; if (map.has(ds)) c.push('has'); if (ds === t) c.push('today'); if (ds === view.left || ds === view.right) c.push('sel');
    h += `<button class="${c.join(' ')}" data-d="${ds}">${d}</button>`;
  }
  host.innerHTML = h + '</div><div class="cal-legend"><span class="lg"></span>초록 칸 + 빨간 점 = 일기를 쓴 날<br>빈 날짜를 누르면 그날 일기를 쓸 수 있어요</div>';
}
$('#panelCal').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) { openDate(b.dataset.d); return; }
  if (b.dataset.c === 't') { const n = new Date(); side.calY = n.getFullYear(); side.calM = n.getMonth(); drawCal(); return; }
  if (b.dataset.cy) { side.calY += Number(b.dataset.cy); drawCal(); return; }
  if (b.dataset.m !== undefined) { side.calM = Number(b.dataset.m); drawCal(); }
});
$('#panelCal').addEventListener('change', e => {
  if (e.target.id === 'calYearInp') {
    const v = parseInt(e.target.value, 10);
    if (v >= 1900 && v <= 2999) { side.calY = v; drawCal(); }
  }
});

async function drawList() {
  const host = $('#panelList'), y = side.listY;
  let map; try { map = await getYear(y); } catch { map = new Map(); }
  const items = [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  let h = `<div class="cal-head"><button data-y="-1">◀</button><input type="number" id="yearInp" value="${y}" min="1900" max="2999"><span>년</span><button data-y="1">▶</button></div>`;
  h += `<div class="list-count">${y}년 · 일기 ${items.length}편</div>`;
  if (!items.length) h += '<p class="muted">이 해에 쓴 일기가 없어요.</p>';
  let lastM = '';
  items.forEach(([ds, v]) => {
    const mm = ds.slice(5, 7);
    if (mm !== lastM) { h += `<div class="mh">${Number(mm)}월</div>`; lastM = mm; }
    const d = parseYmd(ds);
    h += `<button class="li${ds === view.left || ds === view.right ? ' sel' : ''}" data-d="${ds}"><span class="ld">${d.getDate()}일 (${WD[d.getDay()]})</span><span class="lt">${v.title ? esc(v.title) : '<i>제목 없음</i>'}</span></button>`;
  });
  host.innerHTML = h;
}
$('#panelList').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.d) { openDate(b.dataset.d); return; }
  if (b.dataset.y) { side.listY += Number(b.dataset.y); drawList(); }
});
$('#panelList').addEventListener('change', e => {
  if (e.target.id === 'yearInp') {
    const v = parseInt(e.target.value, 10);
    if (v >= 1900 && v <= 2999) { side.listY = v; drawList(); }
  }
});

/* ================= 백업 / 복원 ================= */
async function fetchAll(withPhotos) {
  const s = await getDocs(query(entriesCol(), orderBy('date')));
  const out = [];
  let i = 0;
  for (const d of s.docs) {
    const x = d.data();
    const e = { date: d.id, title: x.title || '', weather: x.weather || '', weatherText: x.weatherText || '', body: x.body || '', createdAt: x.createdAt || null, updatedAt: x.updatedAt || null, photos: [] };
    if (withPhotos && x.photoCount > 0) {
      const ps = await getDocs(query(collection(d.ref, 'photos'), orderBy('ts')));
      e.photos = ps.docs.map(p => ({ id: p.id, ...p.data() }));
    }
    out.push(e);
    i++; if (i % 10 === 0) toast(`불러오는 중… ${i}/${s.docs.length}`, 1500);
  }
  return out;
}
const stamp = () => ymd(new Date());
$('#btnBackup').addEventListener('click', async () => {
  try {
    await flushAll(); toast('백업 파일을 만드는 중…');
    const entries = await fetchAll(true);
    const blob = new Blob([JSON.stringify({ app: 'my-diary', version: 1, exportedAt: new Date().toISOString(), entries })], { type: 'application/json' });
    download(`diary-backup-${stamp()}.json`, blob);
    toast(`일기 ${entries.length}편을 백업했어요. 다운로드 폴더를 확인하세요.`, 4000);
  } catch (e) { console.error(e); toast('백업에 실패했어요. 인터넷 연결을 확인해주세요.'); }
});
$('#btnTxt').addEventListener('click', async () => {
  try {
    await flushAll(); toast('텍스트 파일을 만드는 중…');
    const entries = await fetchAll(false);
    const wxName = k => (WX.find(w => w.k === k) || {}).t || '';
    const txt = entries.map(e => {
      const d = parseYmd(e.date);
      const w = [wxName(e.weather), e.weatherText].filter(Boolean).join(' / ');
      return `==== ${e.date} (${WD[d.getDay()]}) ====\n제목: ${e.title || '(제목 없음)'}\n${w ? '날씨: ' + w + '\n' : ''}\n${e.body}\n`;
    }).join('\n');
    download(`diary-text-${stamp()}.txt`, new Blob(['﻿' + txt], { type: 'text/plain;charset=utf-8' }));
    toast(`일기 ${entries.length}편을 텍스트로 저장했어요. (사진은 포함되지 않아요)`, 4000);
  } catch (e) { console.error(e); toast('내보내기에 실패했어요.'); }
});
$('#btnRestore').addEventListener('click', () => $('#fileRestore').click());
$('#fileRestore').addEventListener('change', async ev => {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  if (!navigator.onLine) { toast('인터넷에 연결된 상태에서 불러와주세요.'); return; }
  let j;
  try { j = JSON.parse(await file.text()); } catch { toast('올바른 백업 파일이 아니에요.'); return; }
  if (!j || !Array.isArray(j.entries)) { toast('올바른 백업 파일이 아니에요.'); return; }
  if (!confirm(`일기 ${j.entries.length}편을 불러올게요.\n같은 날짜의 일기는 백업 내용으로 덮어써요. 계속할까요?`)) return;
  try {
    await flushAll();
    let n = 0;
    for (const e of j.entries) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date || '')) continue;
      const ref = doc(db, 'users', uid, 'entries', e.date);
      const old = await getDocs(collection(ref, 'photos'));
      for (const p of old.docs) await deleteDoc(p.ref);
      const ph = Array.isArray(e.photos) ? e.photos : [];
      await setDoc(ref, { date: e.date, title: e.title || '', weather: e.weather || '', weatherText: e.weatherText || '', body: e.body || '', photoCount: ph.length, createdAt: e.createdAt || Date.now(), updatedAt: Date.now() });
      for (const p of ph) await setDoc(doc(collection(ref, 'photos'), p.id || ('p' + (p.ts || Date.now()))), { data: p.data, ts: p.ts || Date.now(), name: p.name || '' });
      n++; if (n % 5 === 0) toast(`불러오는 중… ${n}/${j.entries.length}`, 1500);
    }
    yearCache.clear(); toast(`일기 ${n}편을 불러왔어요.`, 3500);
    if (view.left) openDate(view.left); else render();
  } catch (e) { console.error(e); toast('불러오는 중 오류가 났어요.'); }
});
async function startedReopen() {
  const s = await getDocs(query(entriesCol(), orderBy('date', 'desc'), limit(1)));
  if (s.docs.length) openDate(s.docs[0].id);
}
</script>
